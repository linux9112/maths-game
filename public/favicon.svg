<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#mathGrad)" />
  <!-- Math symbols in grid: +, -, x, = -->
  <!-- Plus symbol top-left -->
  <path d="M 28 20 L 28 36 M 20 28 L 36 28" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Minus symbol top-right -->
  <path d="M 64 28 L 80 28" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Multiply symbol bottom-left -->
  <path d="M 22 66 L 34 78 M 34 66 L 22 78" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- Equals symbol bottom-right -->
  <path d="M 64 68 L 80 68 M 64 76 L 80 76" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
</svg>
